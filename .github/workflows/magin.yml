name: Build NurGram APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_release:
        description: "Also build the universal release APK (afat)"
        type: boolean
        default: false

env:
  PROJECT_DIR: extracted/NurGram
  PROPRIETARY_PATH: TMessagesProj/src/main/java/com/radolyn/ayugram/proprietary

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "10G"
      CCACHE_HARDLINK: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # The project imports AyuHistoryHook / AyuMessageUtils from this folder.
      # It is a git submodule, so fetch it if the checkout left it empty.
      - name: Ensure proprietary module is present
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f "$PROPRIETARY_PATH/AyuMessageUtils.java" ]; then
            rm -rf "$PROPRIETARY_PATH"
            git clone --depth 1 https://github.com/AyuGram/AyuGram4A_proprietary.git "$PROPRIETARY_PATH"
          fi
          ls "$PROPRIETARY_PATH"

      - name: Create API_KEYS
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          cat << 'EOF' > API_KEYS
          APP_ID = ${{ secrets.TELEGRAM_APP_ID || '6' }}
          APP_HASH = "${{ secrets.TELEGRAM_APP_HASH || 'eb06d4abfb49dc3eeb1aeb98ae0f581e' }}"
          MAPS_V2_API = "${{ secrets.MAPS_KEY || '' }}"
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK, NDK and CMake
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.1" \
            "ndk;21.4.7075529" \
            "cmake;3.10.2.4988404"

      - name: Free disk space and install native deps
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/graalvm /usr/local/.ghcup /usr/local/share/powershell /usr/local/share/chromium
          sudo apt-get update
          sudo apt-get install -y bison gcc make curl ninja-build ccache

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-nurgram
          restore-keys: ccache-nurgram

      - name: Make gradlew executable
        working-directory: ${{ env.PROJECT_DIR }}
        run: chmod +x gradlew

      # beta + debug  -> NurGram-debug.apk (arm64-v8a + armeabi-v7a)
      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleBetaDebug --stacktrace

      - name: Build universal release APK
        if: ${{ github.event_name == 'push' || inputs.build_release }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleAfatRelease --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: NurGram-APKs
          if-no-files-found: error
          path: |
            ${{ env.PROJECT_DIR }}/TMessagesProj/build/outputs/apk/beta/debug/NurGram-debug.apk
            ${{ env.PROJECT_DIR }}/TMessagesProj/build/outputs/apk/afat/release/NurGram-release.apk

